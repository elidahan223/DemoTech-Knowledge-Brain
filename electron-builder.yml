appId: com.demotech.knowledgebrain
productName: DemoTech Knowledge Brain
copyright: Copyright © 2026 DemoTech
directories:
  output: release
  buildResources: electron/assets
asar: true
asarUnpack:
  - build/server/**
  - node_modules/**
npmRebuild: false
files:
  - electron/**
  - build/server/**
  - dist/**
  - package.json
  - '!**/*.map'
extraResources:
  - from: docs
    to: seed/docs
  - from: knowledge_graph.json
    to: seed/knowledge_graph.json
win:
  target:
    - target: nsis
      arch: [x64]
  icon: electron/assets/icon.ico
  artifactName: DemoTech-Knowledge-Brain-Setup-${version}-${arch}.${ext}
  signAndEditExecutable: true
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DemoTech Knowledge Brain
  deleteAppDataOnUninstall: false
  runAfterFinish: true
